<!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
 </head>
 <body>
    
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flashes">
            {% for category, msg in messages %}
             <div class="flash {{ category }}">{{ msg }}</div>
             {% endfor %}
          </div>
          {% endif %}
          {% endwith %} 

<h1>Create Item</h1>
<form method="post" action="{{ url_for('create') }}">
    <div class="form-row">
        <label for="title">Title</label><br>
        <input id="title" name="title" class="input" value="{{ title|e }}">

    </div>

    <div class="form-row">
        <label for="description"> Description</label> <br>
        <textarea name="description" id="description" class="textarea"> {{ description|e}}</textarea>

    </div>

    <div class="form-row">
        <button type="submit" class="btn"> Save</button>
        <a class="btn btn-outline" href="{{ url_for('index') }}"> Cancel</a>
         <a class="btn btn-outline" href="{{ url_for('logout') }}">+ Logout</a>

    </div>
</form>

 </body>
 </html>
